  <meta name="description" content="为 183cm / 68kg 瘦子定制的 16 周薄肌训练计划：四阶段训练编排、30+ 动作库、饮食热量计算、进度打卡追踪。纯前端开源项目，数据只存在你自己的浏览器里。" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e13'/%3E%3Crect x='6' y='24' width='11' height='16' rx='3' fill='%23c2f542'/%3E%3Crect x='47' y='24' width='11' height='16' rx='3' fill='%23c2f542'/%3E%3Crect x='17' y='27' width='7' height='10' rx='2' fill='%235ec8f8'/%3E%3Crect x='40' y='27' width='7' height='10' rx='2' fill='%235ec8f8'/%3E%3Crect x='24' y='29.5' width='16' height='5' rx='2' fill='%23e7edf4'/%3E%3C/svg%3E" />
  <script>
    // 尽早应用主题，避免浅色用户看到深色闪烁
    (function () {
      try {
        var t = localStorage.getItem("boji_theme_v1");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>

          <rect x="6" y="24" width="11" height="16" rx="3" fill="var(--accent)"/>
          <rect x="47" y="24" width="11" height="16" rx="3" fill="var(--accent)"/>
          <rect x="17" y="27" width="7" height="10" rx="2" fill="var(--blue)"/>

          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
